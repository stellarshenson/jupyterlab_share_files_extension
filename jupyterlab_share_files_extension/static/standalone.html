<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Files</title>
<style>
  :root {
    --bg: #f5f7fa;
    --fg: #1f2937;
    --muted: #6b7280;
    --panel: #ffffff;
    --border: #e5e7eb;
    --border-soft: #f3f4f6;
    --input-border: #d1d5db;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-disabled: #93c5fd;
    --secondary-bg: #e5e7eb;
    --secondary-hover: #d1d5db;
    --drop-over-bg: #eff6ff;
    --ok-bg: #d1fae5;
    --ok-fg: #065f46;
    --err-bg: #fee2e2;
    --err-fg: #991b1b;
  }
  html[data-theme="dark"] {
    --bg: #111827;
    --fg: #e5e7eb;
    --muted: #9ca3af;
    --panel: #1f2937;
    --border: #374151;
    --border-soft: #283242;
    --input-border: #4b5563;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --accent-disabled: #1e3a8a;
    --secondary-bg: #374151;
    --secondary-hover: #4b5563;
    --drop-over-bg: #1e3a5f;
    --ok-bg: #064e3b;
    --ok-fg: #6ee7b7;
    --err-bg: #7f1d1d;
    --err-fg: #fecaca;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  header {
    margin-bottom: 24px;
    position: relative;
    /* the theme switch is absolutely placed at the right; the name and the
       meta line stop before it instead of running under it on a phone */
    padding-right: 176px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 600;
  }
  .meta {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .theme-switch {
    position: absolute;
    top: 0;
    right: 0;
    display: flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .theme-switch button {
    background: var(--panel);
    color: var(--muted);
    border: none;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .theme-switch button + button { border-left: 1px solid var(--border); }
  .theme-switch button.active {
    background: var(--accent);
    color: white;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .row .name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .size {
    color: var(--muted);
    font-size: 12px;
    margin-right: 12px;
  }
  .row .indent { display: inline-block; width: 20px; }
  .row .icon {
    width: 16px;
    height: 16px;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .btn {
    display: inline-block;
    text-decoration: none;
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { background: var(--accent-disabled); cursor: not-allowed; }
  .btn.secondary { background: var(--secondary-bg); color: var(--fg); }
  .btn.secondary:hover { background: var(--secondary-hover); }
  .actions {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  .dropzone {
    border: 2px dashed var(--input-border);
    border-radius: 8px;
    padding: 48px 24px;
    text-align: center;
    background: var(--panel);
    transition: all 0.15s;
  }
  .dropzone.drag-over {
    border-color: var(--accent);
    background: var(--drop-over-bg);
  }
  .dropzone p {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 15px;
  }
  .dropzone input[type=file] {
    display: none;
  }
  .progress {
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 13px;
  }
  .progress-bar {
    height: 6px;
    background: var(--secondary-bg);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s;
  }
  .status {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 14px;
  }
  .status.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .status.err { background: var(--err-bg); color: var(--err-fg); }
  footer {
    margin-top: 32px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  .empty {
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
</style>
<script>
  // Theme: light / dark / auto (system). Preference saved in a cookie;
  // default is auto. Runs before first paint to avoid a flash.
  (function() {
    function readCookie() {
      const m = document.cookie.match(/(?:^|;\s*)sf_theme=(light|dark|auto)/);
      return m ? m[1] : 'auto';
    }
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    function apply(pref) {
      const resolved = pref === 'auto' ? (media.matches ? 'dark' : 'light') : pref;
      document.documentElement.setAttribute('data-theme', resolved);
    }
    apply(readCookie());
    media.addEventListener('change', function() {
      apply(readCookie());
    });
    window.__sfSetTheme = function(pref) {
      document.cookie = 'sf_theme=' + pref + '; path=/; max-age=31536000; SameSite=Lax';
      apply(pref);
    };
    window.__sfGetTheme = readCookie;
  })();
</script>
<script>
  window.__SHARE_FILES_CONTEXT__ = __CONTEXT__;
</script>
</head>
<body>
<main>
  <header>
    <div class="theme-switch" id="theme-switch">
      <button type="button" data-pref="light">Light</button>
      <button type="button" data-pref="dark">Dark</button>
      <button type="button" data-pref="auto">Auto</button>
    </div>
    <h1 id="title">Loading...</h1>
    <p class="meta" id="meta"></p>
  </header>
  <section id="content"></section>
  <footer>Share Files - JupyterLab Extension</footer>
</main>
<script>
(function() {
  const ctx = window.__SHARE_FILES_CONTEXT__;
  const titleEl = document.getElementById('title');
  const metaEl = document.getElementById('meta');
  const contentEl = document.getElementById('content');

  // Theme switch buttons - highlight the saved preference, save on click.
  (function() {
    const buttons = document.querySelectorAll('#theme-switch button');
    function highlight() {
      const pref = window.__sfGetTheme();
      buttons.forEach(b => {
        const on = b.dataset.pref === pref;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
    }
    buttons.forEach(b => b.addEventListener('click', function() {
      window.__sfSetTheme(b.dataset.pref);
      highlight();
    }));
    highlight();
  })();

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1) + ' MB';
    return (bytes/(1024*1024*1024)).toFixed(1) + ' GB';
  }

  function api(path) {
    return ctx.api_base.replace(/\/$/, '') + '/' + ctx.kind + '/' + ctx.id + path;
  }

  // Password-protected resources: the page first asks for the password,
  // trades it for an unlock token (rate limited server-side), then sends the
  // token on every API call (header) and download link (?t=).
  let unlockToken = '';
  function authHeaders() {
    return unlockToken ? { 'X-Share-Token': unlockToken } : {};
  }
  // The manifest is re-read after every upload/removal, and it is per-caller
  // (a request manifest shows only your own uploads), so it must never come
  // from a cache. The server now sends no-store, but a browser that cached a
  // manifest BEFORE the upgrade still holds that entry and may reuse it under
  // heuristic freshness - showing a stale file list.
  function manifestInit() {
    return { headers: authHeaders(), cache: 'no-store' };
  }
  function tokenQs() {
    return unlockToken ? '?t=' + encodeURIComponent(unlockToken) : '';
  }

  function start() {
    if (ctx.kind === 'share') {
      loadShare();
    } else if (ctx.kind === 'request') {
      loadRequest();
    }
  }

  if (ctx.password_required) {
    renderPasswordGate();
  } else {
    start();
  }

  function renderPasswordGate() {
    titleEl.textContent = 'Password required';
    metaEl.textContent = 'The owner protected this link with a password.';
    const form = document.createElement('form');
    form.style.cssText = 'display:flex;gap:8px;max-width:420px;';
    const input = document.createElement('input');
    input.type = 'password';
    input.placeholder = 'Password';
    input.autocomplete = 'off';
    input.style.cssText = 'flex:1;padding:8px 12px;border:1px solid var(--input-border);border-radius:6px;font-size:14px;background:var(--panel);color:var(--fg);';
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'Unlock';
    form.appendChild(input);
    form.appendChild(btn);
    const status = document.createElement('div');
    status.setAttribute('role', 'status');
    contentEl.appendChild(form);
    contentEl.appendChild(status);
    input.focus();
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      status.textContent = '';
      status.className = '';
      try {
        const r = await fetch(api('/unlock'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value })
        });
        if (r.status === 429) {
          throw new Error('Too many attempts - wait a moment and try again');
        }
        if (r.status === 404) {
          throw new Error('The owner has removed this share or request.');
        }
        if (!r.ok) {
          const body = await r.json().catch(() => ({}));
          throw new Error(r.status === 401 ? 'Wrong password' : (body.error || ('Unlock failed (' + r.status + ')')));
        }
        const data = await r.json();
        unlockToken = data.token || '';
        contentEl.innerHTML = '';
        titleEl.textContent = 'Loading...';
        metaEl.textContent = '';
        start();
      } catch (err) {
        status.className = 'status err';
        status.textContent = err.message || 'Unlock failed';
        btn.disabled = false;
      }
    });
  }

  async function loadShare() {
    try {
      const r = await fetch(api('/manifest'), manifestInit());
      // 401 means the owner has (or has just added) a password. The page's
      // embedded password_required flag can be stale - it is baked into the
      // HTML at render time - so recover here instead of dead-ending.
      if (r.status === 401) {
        renderPasswordGate();
        return;
      }
      if (!r.ok) throw new Error('Share unavailable');
      const m = await r.json();
      titleEl.textContent = m.name;
      const totalSize = (m.entries || []).reduce((a, e) => a + (e.size || 0), 0);
      metaEl.textContent = (m.entries || []).length + ' item(s) - ' + fmtSize(totalSize);
      renderShare(m);
    } catch (err) {
      titleEl.textContent = 'Share unavailable';
      metaEl.textContent = err.message || 'Could not load this share';
    }
  }

  function renderShare(m) {
    const panel = document.createElement('div');
    panel.className = 'panel';
    if (!m.entries || m.entries.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'This share is empty.';
      panel.appendChild(empty);
    } else {
      for (const e of m.entries) {
        panel.appendChild(renderEntry(e));
      }
    }
    contentEl.appendChild(panel);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const allBtn = document.createElement('a');
    allBtn.className = 'btn';
    allBtn.textContent = 'Download All as ZIP';
    // the server streams the zip as it builds it, so the browser's own
    // download shows progress from the first byte; the download attribute
    // keeps a failed answer in the download list instead of replacing the
    // page - the server's Content-Disposition names the file
    allBtn.href = api('/download-all') + tokenQs();
    allBtn.download = (m.name || 'share') + '.zip';
    actions.appendChild(allBtn);
    contentEl.appendChild(actions);
  }

  function renderEntry(entry) {
    const row = document.createElement('div');
    row.className = 'row';
    const isDir = entry.type === 'directory';
    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = isDir ? '📁' : '📄';
    row.appendChild(icon);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = entry.name;
    row.appendChild(name);
    const size = document.createElement('span');
    size.className = 'size';
    size.textContent = fmtSize(entry.size || 0);
    row.appendChild(size);
    const dl = document.createElement('a');
    dl.className = 'btn secondary';
    dl.textContent = isDir ? 'Download ZIP' : 'Download';
    dl.href = api('/download/' + encodeURIComponent(entry.name)) + tokenQs();
    dl.download = entry.name + (isDir ? '.zip' : '');
    row.appendChild(dl);
    return row;
  }

  async function loadRequest() {
    try {
      const r = await fetch(api('/manifest'), manifestInit());
      // see loadShare - the embedded password_required flag can be stale
      if (r.status === 401) {
        renderPasswordGate();
        return;
      }
      if (!r.ok) throw new Error('Request unavailable');
      const m = await r.json();
      titleEl.textContent = m.name;
      metaEl.textContent = 'Drop files below to upload';
      renderRequest(m);
    } catch (err) {
      titleEl.textContent = 'Request unavailable';
      metaEl.textContent = err.message || 'Could not load this request';
    }
  }

  function renderRequest(m) {
    const wrap = document.createElement('div');

    const uploaderRow = document.createElement('div');
    uploaderRow.style.marginBottom = '12px';
    const uploaderLabel = document.createElement('label');
    uploaderLabel.htmlFor = 'uploader-name';
    uploaderLabel.textContent = 'Your name (optional)';
    uploaderLabel.style.cssText = 'font-size:13px;color:var(--muted);display:block;margin-bottom:4px;';
    uploaderRow.appendChild(uploaderLabel);
    const uploaderInput = document.createElement('input');
    uploaderInput.id = 'uploader-name';
    uploaderInput.type = 'text';
    uploaderInput.placeholder = 'anonymous';
    // identity is the server-set cookie; the name is just a relabelable label
    if (m.me && m.me.name) {
      uploaderInput.value = m.me.name;
    }
    uploaderInput.style.cssText = 'width:100%;padding:8px 12px;border:1px solid var(--input-border);border-radius:6px;font-size:14px;background:var(--panel);color:var(--fg);';
    uploaderRow.appendChild(uploaderInput);
    wrap.appendChild(uploaderRow);

    const dropzone = document.createElement('div');
    dropzone.className = 'dropzone';
    dropzone.innerHTML = '<p>Drop files here to upload</p>';
    const browseBtn = document.createElement('button');
    browseBtn.className = 'btn secondary';
    browseBtn.textContent = 'Browse files...';
    dropzone.appendChild(browseBtn);

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.multiple = true;
    dropzone.appendChild(fileInput);
    wrap.appendChild(dropzone);

    const progressContainer = document.createElement('div');
    progressContainer.setAttribute('role', 'status');
    wrap.appendChild(progressContainer);

    // "Your uploads" - only the caller's own pool (scoped by the identity
    // cookie server-side); lets the uploader review and remove their files
    const mineSection = document.createElement('div');
    mineSection.style.marginTop = '20px';
    const mineTitle = document.createElement('div');
    mineTitle.textContent = 'Your uploads';
    mineTitle.style.cssText = 'font-size:13px;color:var(--muted);margin-bottom:6px;';
    mineSection.appendChild(mineTitle);
    const mineList = document.createElement('div');
    mineSection.appendChild(mineList);
    // a remove failure is written here, under the list, not in an alert()
    const mineStatus = document.createElement('div');
    mineStatus.setAttribute('role', 'status');
    mineSection.appendChild(mineStatus);
    wrap.appendChild(mineSection);

    function renderMine(manifest) {
      mineList.innerHTML = '';
      const mine = (manifest.uploaders && manifest.uploaders[0]) || null;
      const entries = mine ? mine.entries : [];
      if (!entries.length) {
        const empty = document.createElement('div');
        empty.style.cssText = 'font-size:13px;color:var(--muted);';
        empty.textContent = 'Nothing uploaded yet from this browser.';
        mineList.appendChild(empty);
        return;
      }
      const list = document.createElement('div');
      list.className = 'list';
      for (const entry of entries) {
        const row = document.createElement('div');
        row.className = 'row';
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = entry.name;
        row.appendChild(name);
        const size = document.createElement('span');
        size.className = 'size';
        size.textContent = fmtSize(entry.size);
        row.appendChild(size);
        const rm = document.createElement('button');
        rm.className = 'btn secondary';
        rm.textContent = 'Remove';
        rm.setAttribute('aria-label', 'Remove ' + entry.name);
        rm.addEventListener('click', async () => {
          rm.disabled = true;
          mineStatus.textContent = '';
          mineStatus.className = '';
          try {
            const r = await fetch(api('/upload?name=' + encodeURIComponent(entry.name)), {
              method: 'DELETE',
              headers: authHeaders()
            });
            if (!r.ok) {
              const body = await r.json().catch(() => ({}));
              throw new Error(body.error || ('HTTP ' + r.status));
            }
          } catch (err) {
            mineStatus.className = 'status err';
            mineStatus.textContent = 'Could not remove ' + entry.name + ': ' + (err.message || err);
          }
          await refreshMine();
        });
        row.appendChild(rm);
        list.appendChild(row);
      }
      mineList.appendChild(list);
    }

    async function refreshMine() {
      try {
        const r = await fetch(api('/manifest'), manifestInit());
        // This is the only path that runs while the page is open, so it is
        // where a password added (or a token expired) AFTER load actually
        // shows up. Without the gate the list silently stops updating.
        if (r.status === 401) {
          renderPasswordGate();
          return;
        }
        if (!r.ok) return;
        const fresh = await r.json();
        if (fresh.me && fresh.me.name && !uploaderInput.value) {
          uploaderInput.value = fresh.me.name;
        }
        renderMine(fresh);
      } catch (err) {
        /* transient - keep the current list */
      }
    }

    renderMine(m);

    browseBtn.addEventListener('click', (e) => {
      e.preventDefault();
      fileInput.click();
    });
    fileInput.addEventListener('change', () => {
      handleFiles(Array.from(fileInput.files), uploaderInput.value || 'anonymous', progressContainer, refreshMine);
      fileInput.value = '';
    });
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('drag-over');
    });
    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('drag-over');
    });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
      const files = [];
      if (e.dataTransfer.items) {
        for (const item of e.dataTransfer.items) {
          if (item.kind === 'file') {
            const f = item.getAsFile();
            if (f) files.push(f);
          }
        }
      } else {
        for (const f of e.dataTransfer.files) files.push(f);
      }
      handleFiles(files, uploaderInput.value || 'anonymous', progressContainer, refreshMine);
    });

    contentEl.appendChild(wrap);
  }

  async function handleFiles(files, uploader, container, onDone) {
    for (const file of files) {
      await uploadOne(file, uploader, container);
    }
    if (onDone) {
      await onDone();
    }
  }

  function uploadOne(file, uploader, container) {
    return new Promise((resolve) => {
      const progress = document.createElement('div');
      progress.className = 'progress';
      progress.innerHTML = '<div class="row"><span class="name">' + escapeHtml(file.name) + '</span><span class="size">' + fmtSize(file.size) + '</span></div><div class="progress-bar"><div style="width:0%"></div></div>';
      container.appendChild(progress);
      const bar = progress.querySelector('.progress-bar > div');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', api('/upload?uploader=' + encodeURIComponent(uploader)));
      if (unlockToken) {
        xhr.setRequestHeader('X-Share-Token', unlockToken);
      }
      // the raw file as the body: the browser streams it from disk instead
      // of building a multipart body in memory
      xhr.setRequestHeader('X-Filename', encodeURIComponent(file.webkitRelativePath || file.name));
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          bar.style.width = ((e.loaded / e.total) * 100).toFixed(0) + '%';
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          bar.style.width = '100%';
          const status = document.createElement('div');
          status.className = 'status ok';
          status.textContent = 'Uploaded: ' + file.name;
          container.appendChild(status);
        } else {
          const status = document.createElement('div');
          status.className = 'status err';
          let reason = '';
          try { reason = JSON.parse(xhr.responseText).error || ''; } catch (e) { /* not JSON: an HTML error page */ }
          status.textContent = 'Failed: ' + file.name + (reason ? ' - ' + reason : ' (' + xhr.status + ')');
          container.appendChild(status);
        }
        resolve();
      };
      xhr.onerror = () => {
        const status = document.createElement('div');
        status.className = 'status err';
        status.textContent = 'Network error: ' + file.name;
        container.appendChild(status);
        resolve();
      };
      xhr.send(file);
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
})();
</script>
</body>
</html>
